  .tag{ display:inline-block; background:var(--brand-soft); color:var(--brand); border-radius:6px; padding:1px 7px; font-size:12px; font-weight:600; margin-right:6px; }

  button:active{ filter:brightness(.94); }
  .warn{ font-size:12.5px; color:var(--ink2); margin:12px 2px 0; line-height:1.7; }
  .warn b{ color:var(--brand); }

  <h1>演示数据：一下午 6 台</h1>

    <div class="who">

  </div>

  <button id="go" type="button">载入这 6 台，进去看看</button>
  <p class="warn">
    载入会<b>覆盖本机当前账本</b>（只是这台浏览器里的演示数据）。你手机/电脑上自己记的账不受影响——两边存储是分开的。<br>

  </p>
</div>
