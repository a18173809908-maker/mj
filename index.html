<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0F4C3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="往来账">
<meta name="description" content="麻将馆客户往来账目管理，记录欠款与还款，数据保存在本机。">
<title>往来账 · 麻将馆记账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- 应用主体（各页面由 JS 渲染） -->
  <main id="view" class="view" role="main"></main>

  <!-- 底部导航 -->
  <nav id="tabbar" class="tabbar" aria-label="主导航"></nav>

  <!-- 悬浮记账按钮 -->
  <button id="fab" class="fab" type="button" aria-label="记一笔">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <!-- 弹层容器 -->
  <div id="sheet-root"></div>
  <!-- 轻提示 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <!-- 确认对话框 -->
  <div id="dialog-root"></div>
  <!-- 密码锁 -->
  <div id="lock-root"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
